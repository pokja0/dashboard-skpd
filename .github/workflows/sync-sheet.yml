name: Sync data Google Sheet

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-google-sheet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync sheet
        run: python scripts/sync_sheet.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Tidak ada perubahan data."
          else
            git add data/rekap-tim-staf-sekda.csv src/lib/data/rekap.json
            git commit -m "chore: sync data Google Sheet"
            git push
          fi
